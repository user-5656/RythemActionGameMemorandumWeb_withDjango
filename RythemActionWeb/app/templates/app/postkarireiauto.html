{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
 <!-- ナビゲーションバー -->
 <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-primary" href="{% url 'app:post_list' %}"><i class="bi bi-layers-fill me-2"></i>音ゲーを作ろう</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="{% url 'app:post_list' %}">Home</a>
        </li>

      </ul>
    </div>
  </div>
 </nav>
 <!--記事の一覧-->
 <section id="features" class="py-5 bg-light">
    <!-- app/templates/app/post_list.html などの該当箇所 -->
    <div class="container my-4">
    <h2 class="mb-4">投稿記事一覧</h2>

    <div class="row g-4">
        {% for post in posts %}
        <div class="col-md-4">
          <!-- ▼ カード全体をリンクにするための <a> タグ（text-decoration-noneで下線を消す） ▼ -->
          <a href="{% url 'app:post_detail' post.pk %}" class="text-decoration-none text-dark h-100 d-block">
            
            <div class="card h-100 border-0 shadow-sm p-3 text-center card-hover">
              <div class="card-body">
                <div class="feature-icon bg-success text-white mb-3 mx-auto">
                  <i class="bi bi-shield-check"></i>
                </div>
                
                <!-- タイトル -->
                <h5 class="card-title fw-bold">
                    {{ post.title }}
                </h5>
                
                <!-- 作成日 -->
                <p class="card-text text-muted">
                    作成日: {{ post.created_at|date:"Y-m-d" }}
                </p>
              </div>
            </div>

          </a>
          <!-- ▲ リンクここまで ▲ -->
        </div>
        {% empty %}
            <div class="col-12 text-center">
                <p class="text-muted">まだ投稿された記事はありません。</p>
            </div>
        {% endfor %}
    </div>
   </div>
 </section>
  
 
 
 <!-- フッター -->
 <footer class="bg-dark text-white py-4">
    <div class="container text-center">
      <p class="mb-0">&copy; 2026 音ゲーを作ろう. All rights reserved.</p>
    </div>
 </footer>

  <!-- Bootstrap 5 JS Bundle CDN -->
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
