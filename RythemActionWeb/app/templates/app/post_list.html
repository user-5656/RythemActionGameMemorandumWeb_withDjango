{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投稿記事一覧 - 音ゲーを作ろう</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

 <!-- ナビゲーションバー -->
 <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-primary" href="{% url 'app:post_list' %}"><i class="bi bi-layers-fill me-2"></i>音ゲーを作ろう</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="{% url 'app:post_list' %}">Home</a>
        </li>
      </ul>
    </div>
  </div>
 </nav>

 <!-- メインコンテンツ（post_detailと同じ3カラム構造に修正） -->
 <div class="container my-4">
  <div class="row g-4">
   
   <!-- 左サイドバー -->
   <div class="col-lg-3">
    <div class="card border-0 shadow-sm p-3">
     <div class="card-body text-center">
        <img src="{% static 'images/TAPkey広告2.png' %}" class="img-fluid" alt="サンプル画像">
     </div>
    </div>
   </div> 

   <!-- 真ん中（メイン：記事一覧） -->
   <div class="col-lg-6">
     <h2 class="mb-4">投稿記事一覧</h2>
     <div class="row g-4">
        {% for post in posts %}
        <div class="col-12">
          <!-- カード全体をリンクにする -->
          <a href="{% url 'app:post_detail' post.pk %}" class="text-decoration-none text-dark h-100 d-block">
            <div class="card h-100 border-0 shadow-sm p-3 card-hover">
              <div class="card-body">
                <div class="feature-icon bg-success text-white mb-3 text-center" style="width: 40px; height: 40px; line-height: 40px; border-radius: 50%;">
                  <i class="bi bi-shield-check"></i>
                </div>
                
                <!-- タイトル -->
                <h5 class="card-title fw-bold">
                    {{ post.title }}
                </h5>
                
                <!-- 作成日 -->
                <p class="card-text text-muted mb-0">
                    作成日: {{ post.created_at|date:"Y-m-d" }}
                </p>
              </div>
            </div>
          </a>
        </div>
        {% empty %}
            <div class="col-12 text-center">
                <p class="text-muted">まだ投稿された記事はありません。</p>
            </div>
        {% endfor %}
    </div>
   </div> 

   <!-- 右サイドバー -->  
   <div class="col-lg-3">
    <div class="card border-0 shadow-sm p-3">
     <div class="card-body text-center">
       <img src="{% static 'images/TAPkey広告.png' %}" class="img-fluid" alt="サンプル画像">
     </div>
    </div>
   </div>
  
  </div> 
 </div>
  
 <!-- フッター -->
 <footer class="bg-dark text-white py-4 mt-auto">
    <div class="container text-center">
      <p class="mb-0">&copy; 2026 音ゲーを作ろう. All rights reserved.</p>
    </div>
 </footer>

 <!-- Bootstrap 5 JS Bundle CDN -->
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
